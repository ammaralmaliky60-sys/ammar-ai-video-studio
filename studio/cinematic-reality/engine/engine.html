<!doctype html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0;background:#000">
<canvas id="c"></canvas>
<script>
'use strict';
const C = document.getElementById('c');
let gl = null, W = 0, H = 0, RW = 0, RH = 0;
const progs = {}, textures = {};
let fboA = null, texA = null, post = null, vao = null, noiseTex = null;
const VS = `#version 300 es
in vec2 p; out vec2 vUv; void main(){ vUv = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s); throw new Error('compile: ' + log + '\n' + src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n').slice(0, 4000));
  }
  return s;
}
function link(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VS)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));
  p._loc = {}; return p;
}
function loc(p, n) { if (!(n in p._loc)) p._loc[n] = gl.getUniformLocation(p, n); return p._loc[n]; }

function makeTarget(w, h) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  return [f, t];
}

// seeded RNG
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; } }

function makeNoise() {
  const N = 256, r = mulberry(1337), R = new Uint8Array(N*N);
  for (let i = 0; i < N*N; i++) R[i] = Math.floor(r()*256);
  const d = new Uint8Array(N*N*4);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = (y*N + x)*4;
    d[i] = R[y*N + x];
    d[i+1] = R[((y+239) & 255)*N + ((x+37) & 255)];
    d[i+2] = Math.floor(r()*256); d[i+3] = Math.floor(r()*256);
  }
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, N, N, 0, gl.RGBA, gl.UNSIGNED_BYTE, d);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  return t;
}

window.init = function (w, h, rw, rh) {
  W = w; H = h; RW = rw || w; RH = rh || h;
  C.width = W; C.height = H;
  gl = C.getContext('webgl2', { preserveDrawingBuffer: true, premultipliedAlpha: false, alpha: true, antialias: false });
  gl.getExtension('EXT_color_buffer_float'); gl.getExtension('OES_texture_float_linear');
  vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  [fboA, texA] = makeTarget(RW, RH);
  noiseTex = makeNoise();
  return gl.getParameter(gl.VERSION);
};
window.addProgram = function (name, src) { progs[name] = link(src); return true; };
window.loadTexture = function (name, url, opts) {
  opts = opts || {};
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, img);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, opts.mip === false ? gl.LINEAR : gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      const wrap = opts.repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE;
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
      textures[name] = t; res([img.width, img.height]);
    };
    img.onerror = (e) => rej('img load failed ' + name);
    img.src = url;
  });
};

window.loadFloatTex = function (name, w, h, b64, ch) {
  const bin = atob(b64); const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  const f = new Float32Array(buf.buffer);
  const t = textures[name] || gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  ch = ch || 1;
  const fmt = ch === 4 ? [gl.RGBA32F, gl.RGBA] : [gl.R32F, gl.RED];
  gl.texImage2D(gl.TEXTURE_2D, 0, fmt[0], w, h, 0, fmt[1], gl.FLOAT, f);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  textures[name] = t; return [w, h];
};

function setUniforms(p, U) {
  for (const k in U) {
    const v = U[k]; const l = loc(p, k); if (l === null) continue;
    if (typeof v === 'number') gl.uniform1f(l, v);
    else if (Array.isArray(v)) {
      if (k.endsWith('[0]')) gl.uniform4fv(l, new Float32Array(v));
      else if (v.length === 2) gl.uniform2fv(l, v);
      else if (v.length === 3) gl.uniform3fv(l, v);
      else if (v.length === 4) gl.uniform4fv(l, v);
      else if (v.length === 9) gl.uniformMatrix3fv(l, false, v);
      else if (v.length === 16) gl.uniformMatrix4fv(l, false, v);
    }
  }
}
function bindTextures(p, names, extra) {
  let unit = 0;
  gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, noiseTex); gl.uniform1i(loc(p, 'uNoise'), unit); unit++;
  if (extra) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, extra); gl.uniform1i(loc(p, 'uScene'), unit); unit++; }
  for (const n in textures) {
    const l = loc(p, n); if (l === null) continue;
    gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, textures[n]); gl.uniform1i(l, unit); unit++;
  }
}

// render one frame: scene program -> HDR target -> post program -> canvas
window.renderFrame = function (scene, U, P, fmt) {
  const sp = progs[scene];
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboA); gl.viewport(0, 0, RW, RH);
  gl.useProgram(sp); bindTextures(sp);
  setUniforms(sp, Object.assign({ uRes: [RW, RH] }, U));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  const pp = progs[P.prog || 'post'];
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.useProgram(pp); bindTextures(pp, null, texA);
  setUniforms(pp, Object.assign({ uRes: [W, H], uSrcRes: [RW, RH] }, P));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  return C.toDataURL(fmt || 'image/png');
};
</script>
</body></html>

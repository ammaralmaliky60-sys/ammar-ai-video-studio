<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=block" rel="stylesheet">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Tajawal,sans-serif;color:#fff;direction:rtl}
  #bg{position:absolute;inset:0;width:1080px;height:1920px;transform-origin:49% 35%}
  #grade{position:absolute;inset:0;pointer-events:none}
  #fx{position:absolute;inset:0}
  .card{position:absolute;border-radius:34px;backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
        box-shadow:0 18px 50px #0007, inset 0 1px 0 #ffffff22;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .caps{position:absolute;left:60px;right:150px;display:flex;justify-content:center}
  .caps-in{font-size:62px;font-weight:800;line-height:1.35;padding:10px 26px 16px;border-radius:24px;text-align:center;
           background:#14061acc;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
           text-shadow:0 2px 10px #0008;box-shadow:0 10px 30px #0005}
  #safe{position:absolute;inset:0;pointer-events:none;display:none}
</style>
</head>
<body>
<div id="stage">
  <img id="bg" alt="">
  <div id="grade"></div>
  <div id="fx"></div>
  <div id="safe"></div>
</div>
</body>
</html>
